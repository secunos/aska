# cargo-deny policy (release checklist row 1.9). Run: cargo deny check
[licenses]
# Every licence a dependency may carry. Permissive ones only, plus AGPL-3.0-only for our own relay.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "AGPL-3.0-only"]
unused-allowed-license = "allow"
[advisories]
yanked = "deny"
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version; that is intended.
allow-wildcard-paths = true
[sources]
unknown-registry = "deny"
unknown-git = "deny"
