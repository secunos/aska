name: ci
on:
  push:
  pull_request:
  # Rebuild an existing release tag in the release container (an independent rebuild on
  # GitHub's machines, release checklist row 2.2) without touching the tag: Actions → ci →
  # Run workflow → from branch main, tag e.g. v1.0.0.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild in the Debian 13 release container (e.g. v1.0.0)"
        required: true
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config xvfb xdotool strace imagemagick zbar-tools ghostscript python3-nacl python3-argon2 python3-mnemonic   # the last three: reference/aska_ref.py (memory gate scanner)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked   # includes the Python interop tests (python3 is on the runner)
      - run: python3 reference/test_paper.py   # paper-mode reference (DC-04): standard library only
      - run: sudo -E env PATH="$PATH" ./scripts/no-file-writes-lib.sh aska-paper   # the paper crate's tests open nothing for writing
      # The write and memory gates trace or read the Aska processes, which make themselves
      # non-dumpable; only root can do that. Build everything as the runner user first, then
      # run the gates — and only the gates — as root.
      - run: cargo build --release --locked -p aska-drop -p aska -p aska-gui && cargo build --release --locked -p aska-core --example local_e2e
      - run: sudo -E env PATH="$PATH" ./scripts/no-writes-check.sh target/release/aska-drop
      - run: sudo -E env PATH="$PATH" ./scripts/no-file-writes-client.sh target/release/examples/local_e2e
      - run: sudo -E env PATH="$PATH" ./scripts/no-file-writes-cli.sh target/release/aska
      - run: sudo -E env PATH="$PATH" ./scripts/cli-input-unbuffered.sh target/release/aska
      - run: sudo -E env PATH="$PATH" GATE_SHOT_DIR="$PWD/gate-shots" ./scripts/no-file-writes-gui.sh target/release/aska-gui
      - run: ./scripts/timing-parity.sh
      - run: sudo -E env PATH="$PATH" GATE_SHOT_DIR="$PWD/gate-shots" ./scripts/memory-gate-gui.sh target/release/aska-gui   # reads /proc/PID/mem
      - run: sudo -E env PATH="$PATH" GATE_SHOT_DIR="$PWD/gate-shots" ./scripts/memory-gate-paper.sh target/release/aska-gui   # paper mode (DC-04): no pad digit survives "Forget the booklet"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-screenshots
          path: gate-shots/
          if-no-files-found: ignore
  reproducible:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/repro-build.sh && ./scripts/repro-build.sh --compare
  supply-chain:
    # Release checklist rows 1.9 and 1.10: advisories, licences, bans, sources; vendored-tree hash.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-deny --locked && cargo deny check
      - run: cargo install cargo-audit --locked && cargo audit
      - run: ./scripts/vendor-hash.sh
  release-candidate:
    # On a tag: build the release candidate in the Debian 13 container (unsigned — signing
    # happens on the release owner's machine, docs/RELEASING.md §4) and keep it as an artifact
    # for independent rebuilders to compare against.
    # Also on demand for an existing tag (workflow_dispatch above).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - run: docker build -t aska-release release/
      # The checkout belongs to the runner user, git in the container runs as root: declare
      # /src safe, or git refuses it ("dubious ownership") and release.sh stops.
      - run: >-
          docker run --rm -v "$PWD":/src -w /src
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src
          aska-release scripts/release.sh "$TAG"
      - run: cat dist/release/"$TAG"/RELEASE-NOTES.txt && sha256sum dist/release/"$TAG"/aska-drop-* dist/release/"$TAG"/aska-gui-*/bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ env.TAG }}
          path: dist/release/
