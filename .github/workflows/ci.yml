name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config xvfb xdotool strace imagemagick zbar-tools python3-nacl python3-argon2 python3-mnemonic   # the last three: reference/aska_ref.py (memory gate scanner)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked   # includes the Python interop tests (python3 is on the runner)
      # The write and memory gates trace or read the Aska processes, which make themselves
      # non-dumpable; only root can do that. Build everything as the runner user first, then
      # run the gates — and only the gates — as root.
      - run: cargo build --release --locked -p aska-drop -p aska -p aska-gui && cargo build --release --locked -p aska-core --example local_e2e
      - run: sudo -E env PATH="$PATH" ./scripts/no-writes-check.sh target/release/aska-drop
      - run: sudo -E env PATH="$PATH" ./scripts/no-file-writes-client.sh target/release/examples/local_e2e
      - run: sudo -E env PATH="$PATH" ./scripts/no-file-writes-cli.sh target/release/aska
      - run: sudo -E env PATH="$PATH" GATE_SHOT_DIR="$PWD/gate-shots" ./scripts/no-file-writes-gui.sh target/release/aska-gui
      - run: ./scripts/timing-parity.sh
      - run: sudo -E env PATH="$PATH" GATE_SHOT_DIR="$PWD/gate-shots" ./scripts/memory-gate-gui.sh target/release/aska-gui   # reads /proc/PID/mem
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-screenshots
          path: gate-shots/
          if-no-files-found: ignore
  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/repro-build.sh && ./scripts/repro-build.sh --compare
  supply-chain:
    # Release checklist rows 1.9 and 1.10: advisories, licences, bans, sources; vendored-tree hash.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-deny --locked && cargo deny check
      - run: cargo install cargo-audit --locked && cargo audit
      - run: ./scripts/vendor-hash.sh
  release-candidate:
    # On a tag: build the release candidate in the Debian 13 container (unsigned — signing
    # happens on the release owner's machine, docs/RELEASING.md §4) and keep it as an artifact
    # for independent rebuilders to compare against.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t aska-release release/
      - run: docker run --rm -v "$PWD":/src -w /src aska-release scripts/release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist/release/
